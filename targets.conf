# targets.conf - where the parameters live, per partition layout.
#
# stool.sh picks a section by comparing its `layout` line against the sizes the
# device reports in /sys/class/block/*/uevent (PARTNAME + size, in 512-byte
# sectors).  That is the only property that actually decides these offsets: the
# record sits inside pg1fs/pg2fs/mfg/misc, so it changes when the partition
# table does, and not when MID or CID do.  A mid that was rewritten by hand
# still matches.
#
# The section name is the product name hboot reports, which is what
# `fastboot getvar product` prints: `m8_ul` on this phone.  Picking the section
# uses the `layout` line and nothing else.
#
# Field syntax:  <partition>:<offset>:<length>:<encoding>
#   length is always in bytes
#   ascii    8 chars, no terminator
#   utf16le  2 bytes per character, so a 9-char MID is 18
#   u32      little-endian, 0 or 3 / 0 or 4
#   magic    4 ASCII bytes, HTCU = unlocked, 00000000 = locked
#   raw      whole partition from <offset>
#
# To add a model: dump the small partitions (README section 6), derive the six
# offsets, and paste the observed layout string - the script prints it
# verbatim when nothing matches.

[m8_ul]
layout   = hboot:8192 sp1:10240 pg1fs:243646 board_info:32 mfg:512 pg2fs:48510 misc:2048
cid      = board_info:0x14:8:ascii
mid      = mfg:0x4000:18:utf16le   # 9 chars x 2 bytes
version  = misc:0xA0:16:ascii
tamper   = pg2fs:0x511804:4:u32
secure   = pg1fs:0x8400:4:u32
blmagic  = pg1fs:0x8404:4:magic
blpart   = hboot   # the partition the bootloader image lives in
splash   = sp1:0:0:raw
screen   = 1080x1920
